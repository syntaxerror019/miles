<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {
    if (localStorage.getItem("dark-mode") === "enabled") {
        document.head.appendChild(Object.assign(document.createElement('link'), { id: 'dark-mode-css', rel: 'stylesheet', href: '/css/dark-mode.css' }));
    }
});
</script>

{{ $scripts := resources.Get "scripts.js" }}
{{ if $scripts }}
  {{ if .Site.IsServer }}
    <script src="{{ $scripts.RelPermalink }}" defer></script>
  {{ else }}
    {{ $scripts = $scripts | minify | fingerprint }}
    <script
      src="{{ $scripts.RelPermalink }}"
      integrity="{{ $scripts.Data.Integrity }}"
      crossorigin="anonymous"
      defer></script>
  {{ end }}
{{ end }}
